name: Publish
permissions: {}

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build wheels and command line tools
    permissions: {}
    uses: ./.github/workflows/build_wheels.yml  # zizmor: ignore[self-repository]

  publish:
    # We do not want to publish if either, building wheels or the command line
    # tools, fail because both should be in good shape for a release.
    needs: build
    name: Publish wheels to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: ./wheelhouse/

      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: ./wheelhouse/

name: Style checks
permissions: {}
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  segyio_version: '1.9.14'
  python_version: '3.11'

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: "${{ env.python_version }}"
        enable-cache: true
        cache-dependency-glob: python/uv.lock

    - name: Install pre-commit
      working-directory: python
      run: |
        uv sync --locked --no-install-project --group dev
        echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

    - name: Cache pre-commit environments
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Run pre-commit
      run: pre-commit run --all-files --show-diff-on-failure

  build-and-test:
    name: Build and test
    needs: cppcheck
    permissions: {}
    uses: ./.github/workflows/build_and_test.yml # zizmor: ignore[self-repository]

  cppcheck:
    name: cppcheck
    needs: pre-commit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential \
          libboost-dev libeigen3-dev libfftw3-dev cppcheck

    - name: Build and install segyio
      run: |
        git clone --branch "v${{ env.segyio_version}}" https://github.com/equinor/segyio.git
        cd segyio
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DBUILD_PYTHON=OFF \
          -DEXPERIMENTAL=ON \
          -DBUILD_TESTING=OFF \
          -DBUILD_BIN=OFF
        make -j
        sudo make install

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: "${{ env.python_version }}"
        enable-cache: true
        cache-dependency-glob: python/uv.lock

    - name: Install Python dependencies
      working-directory: python
      run: |
        uv sync --locked --no-install-project --group dev
        echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

    - name: Configure project (command line tools)
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DUSE_FFTW=ON \
              ..

    - name: Run cppcheck (command line tools)
      working-directory: build
      run: |
        cppcheck --enable=style,portability,performance,warning \
                 --library=posix \
                 --inline-suppr \
                 --project=compile_commands.json \
                 --error-exitcode=1 \
                 --suppressions-list=../cppcheck/suppressions.txt \
                 --verbose \
                 --template="{file}:{line} [{severity}] {message}"

    - name: Configure project (Python bindings)
      working-directory: python
      run: |
        uv sync --locked --no-editable --group dev \
          -C cmake.define.CMAKE_BUILD_TYPE=Release \
          -C cmake.define.USE_FFTW=ON \
          -C cmake.define.CMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -C build-dir=cppcheck-build

    - name: Run cppcheck (Python bindings)
      working-directory: python/cppcheck-build
      run: |
        cppcheck --enable=style,portability,performance,warning \
                 --library=posix \
                 --inline-suppr \
                 --project=compile_commands.json \
                 --error-exitcode=1 \
                 --suppressions-list=../../cppcheck/suppressions.txt \
                 --verbose \
                 --template="{file}:{line} [{severity}] {message}"
